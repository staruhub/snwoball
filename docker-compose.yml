services:
  postgres:
    image: postgres:15
    container_name: snowball-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: snowball
      POSTGRES_USER: snowball
      POSTGRES_PASSWORD: snowball123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snowball -d snowball"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: snowball-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
